<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="45%" fy="45%">
      <stop offset="0%" stop-color="#0f1f3d" />
      <stop offset="60%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Ring Border Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Cloud Body Gradient -->
    <linearGradient id="cloudGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Lightning / AI Spark Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.85" filter="url(#subtleGlow)" />
  <circle cx="256" cy="256" r="242" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Atmospheric Glow behind Cloud -->
  <ellipse cx="250" cy="255" rx="145" ry="90" fill="#0284c7" opacity="0.35" filter="url(#cyanGlow)" />

  <!-- Cloud Base Shape -->
  <path d="M 175 320 
           C 135 320 102 288 102 248 
           C 102 214 125 186 157 178 
           C 166 130 208 94 258 94 
           C 301 94 338 120 353 158 
           C 367 150 384 146 402 146 
           C 445 146 480 181 480 224 
           C 480 230 479 236 478 241 
           C 498 253 512 276 512 302
           C 512 342 478 372 436 372 
           L 175 372 
           Z" 
        transform="translate(-32, -26) scale(0.95)"
        fill="url(#cloudGrad)" 
        opacity="0.95" />

  <!-- Cloud Highlights & Depth -->
  <path d="M 175 315 
           C 142 315 115 288 115 255 
           C 115 226 135 202 162 195 
           C 170 155 206 124 249 124 
           C 285 124 316 146 329 178 
           C 341 171 356 167 371 167 
           C 407 167 437 197 437 233 
           C 437 238 436 243 435 248 
           C 451 258 462 277 462 299 
           C 462 333 434 358 399 358 
           L 175 358 Z" 
        transform="translate(-32, -26) scale(0.95)"
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        opacity="0.8" 
        filter="url(#subtleGlow)" />

  <!-- High-Tech WeatherGPT Energy Lightning Bolt / AI Core -->
  <path d="M 276 186 
           L 204 294 
           L 256 294 
           L 214 402 
           L 326 270 
           L 268 270 
           Z" 
        fill="url(#boltGrad)" 
        filter="url(#cyanGlow)" />
        
  <path d="M 273 194 
           L 212 288 
           L 260 288 
           L 224 384 
           L 316 276 
           L 268 276 
           Z" 
        fill="#ffffff" 
        opacity="0.9" />

  <!-- 4-point AI Sparkle Stars -->
  <!-- Top Right Sparkle -->
  <path d="M 400 95 Q 400 120 425 120 Q 400 120 400 145 Q 400 120 375 120 Q 400 120 400 95 Z" 
        fill="#ffffff" 
        filter="url(#subtleGlow)" />
  <circle cx="400" cy="120" r="3.5" fill="#38bdf8" />

  <!-- Smaller Left Sparkle -->
  <path d="M 95 180 Q 95 195 110 195 Q 95 195 95 210 Q 95 195 80 195 Q 95 195 95 180 Z" 
        fill="#bae6fd" 
        opacity="0.9" />
</svg>
